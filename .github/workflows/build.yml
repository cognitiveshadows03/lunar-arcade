name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Engine tests + economy sim + debug APK
        run: |
          chmod +x gradlew
          ./gradlew :core:gamification:test :simulator:run :apps:repquest:assembleDebug --stacktrace
